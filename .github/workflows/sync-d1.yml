name: Sync registry to D1

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/content/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate registry snapshot JSON
        run: bun run sync:d1

      - name: Sync to remote D1 (optional)
        if: vars.CF_D1_SYNC_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run sync:d1:remote
        working-directory: apps/api
