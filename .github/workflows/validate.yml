name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate registry snapshot
        run: bun run sync:d1

      - name: Validate content
        run: bun run validate

      - name: Build
        run: bun run build

      - name: Verify artifact checksums
        run: bun run verify-artifacts
        continue-on-error: true

      - name: Test
        run: bun test

      - name: Report
        run: |
          echo "### Validation passed :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Content schemas valid" >> $GITHUB_STEP_SUMMARY
          echo "- License allowlist satisfied" >> $GITHUB_STEP_SUMMARY
          echo "- Site builds cleanly" >> $GITHUB_STEP_SUMMARY
          echo "- Pages generated: $(find apps/web/dist -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
